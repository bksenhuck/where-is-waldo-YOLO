substitutions:
  _REGION: us-central1
  _AR_REPO: where-is-waldo
  _SERVICE: where-is-waldo
  _GCS_BUCKET: where-is-waldo-artifacts
  _API_BASE: "https://REPLACE-WITH-CLOUD-RUN-URL"

steps:
  # ── 1. Build Docker image ──────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: Build image
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA"
      - .

  # ── 2. Push to Artifact Registry ──────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: Push image
    args:
      - push
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA"

  # ── 3. Deploy to Cloud Run ─────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 2Gi
      - --cpu
      - "2"
      - --set-env-vars
      - API_BASE=${_API_BASE},GCS_BUCKET_NAME=${_GCS_BUCKET}

  # ── 4. Upload artifacts to GCS ─────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Upload artifacts to GCS
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # Model weights
        gsutil -m rsync -r frontend/models       gs://${_GCS_BUCKET}/models       || true
        gsutil -m rsync -r frontend/data/models  gs://${_GCS_BUCKET}/models/data  || true
        # Training data
        gsutil -m rsync -r frontend/data/images  gs://${_GCS_BUCKET}/data/images  || true
        gsutil -m rsync -r frontend/data/labels  gs://${_GCS_BUCKET}/data/labels  || true
        # Generated assets
        gsutil -m rsync -r frontend/assets       gs://${_GCS_BUCKET}/assets        || true

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
